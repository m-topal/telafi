---
layout: default
title: Arşiv
---

<header class="page-header shell">
  <p class="kicker">TELAFİ</p>
  <h1>Arşiv</h1>
</header>

<section class="archive shell">
{% if site.posts.size > 0 %}
  {% for post in site.posts %}
  <a class="archive-row" href="{{ post.url | relative_url }}">
    <time>{{ post.date | date: "%d.%m.%Y" }}</time>
    <strong>{{ post.title }}</strong>
    <em>{{ post.category }}</em>
  </a>
  {% endfor %}
{% else %}
  <p class="empty-copy">Arşiv henüz boş.</p>
{% endif %}
</section>
