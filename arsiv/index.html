---
layout: default
title: Arşiv
---
{% assign items = site.yazilar | sort: "date" | reverse %}
<section class="page shell">
  <header class="page-header page-header--listing">
    <p class="kicker">TELAFİ</p>
    <h1>Arşiv</h1>
  </header>
  {% if items.size > 0 %}
  <div class="archive">
    {% for item in items %}
    <a class="archive-row" href="{{ item.url | relative_url }}">
      <time>{{ item.date | date: "%d.%m.%Y" }}</time>
      <strong>{{ item.title }}</strong>
      <em>{{ item.category }}</em>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p class="empty-copy">Arşiv henüz boş.</p>
  {% endif %}
</section>
