---
layout: default
---
<section class="shell article-shell">
  <article class="article-frame">
    <p class="kicker">{{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="page-deck">{{ page.excerpt_text }}</p>{% endif %}
    <div class="meta-row">
      <span>{{ page.author }}</span>
      <span>{{ page.date | date: "%d.%m.%Y" }}</span>
      <span>{{ page.reading_time }}</span>
    </div>
    <div class="prose">{{ content }}</div>
  </article>
</section>
