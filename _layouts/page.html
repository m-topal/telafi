---
layout: default
---
<section class="shell page-shell">
  <div class="page-frame">
    <p class="kicker">{{ page.kicker | default: "TELAFİ" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
  </div>

  <div class="content-frame prose">
    {{ content }}
  </div>
</section>
