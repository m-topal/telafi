layout: default

<section class="page shell">
  <header class="page-header">
    <p class="kicker">{{ page.kicker | default: "TELAFİ" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-copy prose">{{ content }}</div>
</section>
