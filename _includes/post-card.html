<article class="story-card" data-category="{{ include.post.category | downcase }}">
  {% if include.post.image %}
  <a class="story-card__image" href="{{ include.post.url | relative_url }}">
    <img src="{{ include.post.image | relative_url }}" alt="{{ include.post.image_alt | default: '' }}">
  </a>
  {% endif %}

  <div class="story-card__content">
    <p class="kicker">{{ include.post.category }}</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    {% if include.post.excerpt_text %}
      <p class="story-card__excerpt">{{ include.post.excerpt_text }}</p>
    {% endif %}
    <p class="meta">{{ include.post.author }} · {{ include.post.reading_time }}</p>
  </div>
</article>
