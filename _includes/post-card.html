<article class="post-card">
  <a class="post-card__image" href="{{ include.post.url | relative_url }}" aria-label="{{ include.post.title }}">
    {% if include.post.image %}
      <img src="{{ include.post.image | relative_url }}" alt="">
    {% else %}
      <div class="post-card__placeholder">{{ include.post.category | default: "TELAFİ" }}</div>
    {% endif %}
  </a>
  <div class="post-card__body">
    <p class="kicker">{{ include.post.category }}</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    {% if include.post.excerpt_text %}
      <p class="post-card__excerpt">{{ include.post.excerpt_text }}</p>
    {% endif %}
    <p class="post-meta">{{ include.post.author }} · {{ include.post.reading_time }}</p>
  </div>
</article>
