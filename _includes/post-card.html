<article class="post-card">
  <div class="post-card-body">
    <p class="kicker">{{ include.post.category }}</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    {% if include.post.excerpt_text %}
      <p class="excerpt">{{ include.post.excerpt_text }}</p>
    {% endif %}
    <p class="meta">{{ include.post.author }} · {{ include.post.reading_time }}</p>
  </div>
</article>
